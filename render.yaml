# Render Blueprint — https://dashboard.render.com/blueprints
# Creates a Docker web service + Postgres. After first deploy, seed once:
#   Shell → flask seed
services:
  - type: web
    name: ledger
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_MODE
        value: stub
      - key: SEED
        value: "20260723"

databases:
  - name: ledger-db
    plan: free
    databaseName: ledger
    user: ledger
